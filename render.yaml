services:
  - type: web
    name: socialflow-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_VIDEO_MODEL
        value: veo-3.1-fast-generate-preview
      - key: APP_URL
        value: https://socialflow-api.onrender.com
      - key: FRONTEND_URL
        value: https://socialflow-web.onrender.com
